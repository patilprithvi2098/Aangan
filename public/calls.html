<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>All calls</title>
<style>
:root{--bg:#fafaf7;--card:#fff;--ink:#1d2433;--mut:#667;--line:#e3e5ea;--ok:#1b6e4a;--warn:#b3261e;--amb:#a15c00}
@media(prefers-color-scheme:dark){:root{--bg:#14161b;--card:#1c1f26;--ink:#e8eaf0;--mut:#9aa3b2;--line:#2c313b;--ok:#6fcf9f;--warn:#f2827a;--amb:#f0b45c}}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,Segoe UI,Helvetica,Arial,sans-serif}
main{max-width:1000px;margin:0 auto;padding:20px 16px 60px}h1{font-size:22px;margin:0 0 4px}.sub{color:var(--mut);margin-bottom:14px}a{color:inherit}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:14px}.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}.tile b{display:block;font-size:22px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 12px;cursor:pointer}button.on{background:var(--ink);color:var(--bg)}
.row{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 0}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.t{font-weight:600}.m{color:var(--mut);font-size:13px}
.pill{font-size:12px;font-weight:600;border-radius:10px;padding:1px 9px;border:1px solid currentColor}.qualified{color:var(--ok)}.declined{color:var(--warn)}.escalated{color:var(--amb)}.missed,.info_only{color:var(--mut)}
.hot{color:var(--warn)}.priority{color:var(--amb)}.standard{color:var(--ok)}
</style></head><body><main>
<h1>All calls</h1><div class="sub">Every call with its qualification status. Transcripts and recordings are in <a href="https://app.vaanivoice.ai/conversations/history" target="_blank" rel="noopener">Vaani, Conversations, History</a>. · <a href="/queue">Front desk queue</a> · <a href="/calendar">Designer calendars</a></div>
<div class="tiles" id="tiles"></div><div class="filters" id="filters"></div><div id="list">Loading…</div></main>
<script>
const key=localStorage.getItem('key')||prompt('Access key');localStorage.setItem('key',key||'');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const when=d=>d?new Date(d).toLocaleString('en-IN',{timeZone:'Asia/Kolkata',weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}):'';
let all=[],filter='all';
function draw(){
 const rows=all.filter(c=>filter==='all'||c.outcome===filter);
 document.getElementById('list').innerHTML=rows.length?rows.map(c=>`<div class="row"><div class="top"><div><span class="t">${esc(c.caller_name||'Caller')}</span> <span class="m">${esc(c.area||'')} ${esc(c.project_type||'')}</span></div><div><span class="pill ${esc(c.outcome)}">${esc(c.outcome.replace('_',' '))}</span> ${c.tier?`<span class="pill ${esc(c.tier)}">${esc(c.tier)}</span>`:''}</div></div>
 <div class="m">${when(c.created_at)}${c.caller_phone?' · '+esc(c.caller_phone):''}${c.designer?' · Designer '+esc(c.designer)+' at '+when(c.slot_start):''}${c.status&&c.status!=='new'?' · status: '+esc(c.status):''}</div>
 ${c.decline_reason?`<div class="m">Reason: ${esc(c.decline_reason)}${c.reviewed?' (reviewed)':''}</div>`:''}${c.summary?`<div>${esc(c.summary)}</div>`:''}
 <div class="m">${c.telegram_sent?'Designer messaged on Telegram':''}${c.in_hubspot?' · In HubSpot':''}${c.window_missed?' · Booked outside its call-by window':''}</div></div>`).join(''):'<div class="m">No calls yet.</div>';
 document.getElementById('filters').innerHTML=['all','qualified','declined','escalated','missed','info_only'].map(f=>`<button class="${f===filter?'on':''}" data-f="${f}">${f.replace('_',' ')}</button>`).join('');
}
async function load(){
 const r=await fetch('/api/calls',{headers:{'x-api-key':key}}).then(r=>r.json());
 if(r.error){document.getElementById('list').textContent='Access key not accepted. Clear it and reload.';localStorage.removeItem('key');return}
 all=r.calls;const t=r.totals;
 document.getElementById('tiles').innerHTML=[['Calls',t.total],['Qualified',t.qualified],['Declined',t.declined],['Escalated',t.escalated],['Missed',t.missed]].map(([a,b])=>`<div class="tile">${a}<b>${b}</b></div>`).join('');
 draw();
}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-f]');if(b){filter=b.dataset.f;draw()}});
load();setInterval(load,15000);
</script></body></html>
