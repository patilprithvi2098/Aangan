<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Front desk queue</title>
<style>
:root{--bg:#fafaf7;--card:#fff;--ink:#1d2433;--mut:#667;--line:#e3e5ea;--warn:#b3261e;--ok:#1b6e4a}
@media(prefers-color-scheme:dark){:root{--bg:#14161b;--card:#1c1f26;--ink:#e8eaf0;--mut:#9aa3b2;--line:#2c313b;--warn:#f2827a;--ok:#6fcf9f}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,Segoe UI,Helvetica,Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:20px 16px 60px}h1{font-size:22px;margin:0 0 4px}.sub{color:var(--mut);margin-bottom:20px}
h2{font-size:15px;margin:26px 0 8px;display:flex;gap:8px;align-items:center}.n{background:var(--warn);color:#fff;border-radius:10px;padding:0 8px;font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.t{font-weight:600}.m{color:var(--mut);font-size:13px}button{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
.empty{color:var(--mut);padding:8px 0}a{color:inherit}
</style></head><body><main>
<h1>Front desk queue</h1><div class="sub">Things to do now. Open <a href="/calendar">designer calendars</a> · <a href="/calls">all calls</a> · <a href="/designer">my leads</a>.</div>
<div id="out">Loading…</div></main>
<script>
const key=localStorage.getItem('key')||prompt('Access key');localStorage.setItem('key',key||'');
const api=(p,o={})=>fetch(p,{...o,headers:{'x-api-key':key,'content-type':'application/json'}}).then(r=>r.json());
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const when=d=>new Date(d).toLocaleString('en-IN',{timeZone:'Asia/Kolkata',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
function sec(title,rows,render,btn){return `<h2>${title}<span class="n" ${rows.length?'':'style="background:var(--ok)"'}>${rows.length}</span></h2>`+(rows.length?rows.map(r=>`<div class="card"><div>${render(r)}</div>${btn?`<button data-id="${r.id}" data-a="${btn[1]}">${btn[0]}</button>`:''}</div>`).join(''):'<div class="empty">Nothing waiting.</div>')}
async function load(){
 const q=await api('/api/queue');if(q.error){document.getElementById('out').textContent='Access key not accepted. Clear it and reload.';localStorage.removeItem('key');return}
 document.getElementById('out').innerHTML=
 sec('Escalations: call back within 15 minutes',q.escalations,r=>`<div class="t">${esc(r.caller_name||'Caller')} · ${esc(r.caller_phone||'no number')}</div><div class="m">${when(r.created_at)} · ${esc(r.summary||'')}</div>`,['Done','done'])+
 sec('Callbacks owed (missed or dropped calls)',q.callbacks,r=>`<div class="t">${esc(r.caller_phone||'no number')}</div><div class="m">${when(r.created_at)}</div>`,['Done','done'])+
 sec('Declined calls to review',q.declines,r=>`<div class="t">${esc(r.caller_name||'Caller')} · ${esc(r.area||'')}</div><div class="m">${when(r.created_at)} · Reason: ${esc(r.decline_reason||'')}</div><div class="m">${esc(r.summary||'')}</div>`,['Reviewed','reviewed'])+
 sec('Bookings at risk (call-by time passed or no slot in window)',q.lateBookings,r=>`<div class="t">${esc(r.caller_name||'Lead')} · ${esc(r.designer)} · ${esc(r.tier)}</div><div class="m">Call by ${when(r.call_by)}</div>`,['Done','done']);
}
document.addEventListener('click',async e=>{const b=e.target.closest('button[data-id]');if(!b)return;b.disabled=true;await api('/api/review',{method:'POST',body:JSON.stringify({id:Number(b.dataset.id),action:b.dataset.a})});load()});
load();setInterval(load,15000);
</script></body></html>
